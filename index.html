<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Medicinas de Lilian</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3D7A5C" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="icon" href="/icons/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FAF7F0; font-family: 'Atkinson Hyperlegible', sans-serif; color: #20302A; }
  .topbar { background: #3D7A5C; padding: 18px 20px; color: #fff; }
  .topbar-inner { display: flex; align-items: center; justify-content: space-between; max-width: 720px; margin: 0 auto; }
  .titulo { font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 600; }
  .fecha { font-size: 13px; opacity: .85; }
  .tabs { display: flex; gap: 6px; background: rgba(255,255,255,.15); border-radius: 999px; padding: 4px; }
  .tab-btn { border: none; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; background: transparent; color: #fff; cursor:pointer; }
  .tab-btn.activo { background: #fff; color: #3D7A5C; }
  .contenedor { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  .aviso-permiso { width: 100%; display:flex; align-items:center; gap:10px; background:#FBEEDE; border:2px solid #E3B27B; border-radius:16px; padding:14px 16px; margin-bottom:18px; font-size:15px; color:#7A4A17; font-weight:600; cursor:pointer; }
  .tarjeta-cita { background:#3F5B8C; color:#fff; border-radius:20px; padding:16px 18px; margin-bottom:22px; }
  .cita-label { font-size:13px; opacity:.85; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .cita-fecha { font-size:17px; font-weight:700; margin-top:2px; }
  .grupo-titulo { font-family:'Fredoka', sans-serif; font-size:19px; font-weight:600; margin: 6px 0 10px; display:flex; align-items:center; gap:8px; }
  .med-card { display:flex; align-items:center; gap:14px; text-align:left; background:#fff; border:2px solid #EAE4D8; border-radius:18px; padding:16px; margin-bottom:10px; width:100%; cursor:pointer; }
  .med-card.hecho { background:#EAF3EC; border-color:#3D7A5C; }
  .circulo { width:30px; height:30px; border-radius:50%; border:2.5px solid #C8C0AE; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .circulo.hecho { border-color:#3D7A5C; background:#3D7A5C; color:#fff; }
  .med-nombre { font-size:17px; font-weight:700; }
  .med-dosis { font-size:14px; color:#5B6259; }
  .med-nota { font-size:13px; color:#8A8271; margin-top:2px; }
  .med-hora { font-size:13px; font-weight:700; border-radius:10px; padding:4px 8px; }
  .fila-titulo { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .fila-titulo h2 { font-family:'Fredoka', sans-serif; font-size:18px; font-weight:600; margin:0; }
  .btn { border:none; border-radius:12px; padding:9px 14px; font-size:14px; font-weight:600; color:#fff; cursor:pointer; display:flex; align-items:center; gap:6px; }
  .btn-verde { background:#3D7A5C; }
  .btn-azul { background:#3F5B8C; }
  .item-lista { background:#fff; border:1px solid #EAE4D8; border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .item-lista .info { flex: 1; }
  .item-lista .nombre { font-size:15px; font-weight:700; }
  .item-lista .detalle { font-size:13px; color:#5B6259; }
  .btn-icono { background:#F3F0E7; border:none; border-radius:10px; padding:8px; cursor:pointer; }
  .btn-icono.borrar { background:#F8E7E1; color:#B4472A; }
  form.editor { max-width: 560px; margin:0 auto; }
  .campo { margin-bottom:16px; }
  .campo label { font-size:13px; font-weight:700; color:#5B6259; margin-bottom:6px; display:block; }
  .campo input, .campo select { width:100%; border:2px solid #EAE4D8; border-radius:12px; padding:11px 12px; font-size:15px; background:#fff; color:#20302A; }
  .volver { background:none; border:none; color:#5B6259; font-size:14px; margin-bottom:14px; cursor:pointer; padding:0; }
  .oculto { display:none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div>
      <div class="titulo">Medicinas de Lilian</div>
      <div class="fecha" id="fecha-hoy"></div>
    </div>
    <div class="tabs">
      <button class="tab-btn activo" id="tab-hoy" onclick="cambiarVista('hoy')">Hoy</button>
      <button class="tab-btn" id="tab-editar" onclick="cambiarVista('editar')">Editar</button>
    </div>
  </div>
</div>

<div class="contenedor" id="contenedor"></div>

<script src="/app.js"></script>
</body>
</html>
